# ============================================================
# Hyprland + Wayland on Arch
#
# Reference: https://wiki.hyprland.org/Nvidia/
# Last verified: 2025-03-09
#
# Nvidia packages (driver, utils, settings, headers, libva) are
# installed by pacman in the base role. The nvidia_driver_map in
# site.yml pre_tasks builds the correct list per GPU generation.
# This role has zero Nvidia awareness.
#
# Nvidia env vars belong in hyprland.lua, NOT zsh dotfiles.
# ============================================================

- name: Skip Hyprland role on non-Arch systems
  ansible.builtin.meta: end_role
  when: ansible_facts['distribution'] != 'Archlinux'

- name: Install Hyprland desktop packages
  become: true
  community.general.pacman:
    name:
      # Compositor
      - hyprland
      - xdg-desktop-portal-hyprland
      - uwsm
      - hyprpolkitagent
      - hyprlock
      - hypridle

      # Terminal & fonts
      - ghostty
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - ttf-jetbrains-mono-nerd

      # Desktop utilities
      - jq
      - mako
      - wl-clipboard
      - brightnessctl
      - playerctl
      - hyprshot
      - hyprpicker
      - hyprsunset
      - hyprlauncher
      - hyprpwcenter
      - helium-browser-bin
      - localsend
      - code
      - mpv
      - waybar
      - yt-dlp
      - zathura-pdf-poppler

      # Dev Packages
      - rustup
      - fnm
    state: present

- name: Enable Hyprland user services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    scope: user
  loop:
    - waybar.service
    - hypridle.service
    - hyprsunset.service
    - hyprpolkitagent.service
  environment:
    # Required for Ansible to interact with user-level systemd daemons
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
