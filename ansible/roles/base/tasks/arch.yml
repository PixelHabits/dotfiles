# ── Arch package source infrastructure ──────────────────────
# Verify pacman is configured with CachyOS repositories before
# installing the Arch package set.

- name: Check CachyOS repositories are configured
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - ^\[(cachyos|cachyos-v3|cachyos-v4|cachyos-znver4)\]
      - /etc/pacman.conf
  register: cachyos_repo_check
  changed_when: false
  failed_when: false

- name: Prompt before updating pacman repositories with CachyOS
  ansible.builtin.pause:
    prompt: |
      CachyOS repositories are not configured.

      Update pacman repositories with the CachyOS repo script now?
      This imports CachyOS keys, updates /etc/pacman.conf, installs
      CachyOS mirrorlists/keyring, and runs pacman -Syu.
      After this confirmation, the script runs non-interactively.

      Type yes to continue
  register: cachyos_repo_prompt
  when: cachyos_repo_check.rc != 0

- name: Abort when CachyOS repository update is declined
  ansible.builtin.fail:
    msg: |
      CachyOS repositories are not configured.

      Update pacman repositories with the CachyOS repo script:
        curl -O https://mirror.cachyos.org/cachyos-repo.tar.xz
        tar xvf cachyos-repo.tar.xz
        cd cachyos-repo
        sudo ./cachyos-repo.sh
  when:
    - cachyos_repo_check.rc != 0
    - (cachyos_repo_prompt.user_input | default('') | lower) != 'yes'

- name: Create CachyOS repo bootstrap directory
  ansible.builtin.tempfile:
    state: directory
    suffix: cachyos-repo
  register: cachyos_repo_tmp
  when:
    - cachyos_repo_check.rc != 0
    - (cachyos_repo_prompt.user_input | default('') | lower) == 'yes'

- name: Download CachyOS repo script archive
  ansible.builtin.get_url:
    url: https://mirror.cachyos.org/cachyos-repo.tar.xz
    dest: "{{ cachyos_repo_tmp.path }}/cachyos-repo.tar.xz"
    mode: "0644"
  when:
    - cachyos_repo_check.rc != 0
    - (cachyos_repo_prompt.user_input | default('') | lower) == 'yes'

- name: Extract CachyOS repo script archive
  ansible.builtin.unarchive:
    src: "{{ cachyos_repo_tmp.path }}/cachyos-repo.tar.xz"
    dest: "{{ cachyos_repo_tmp.path }}"
    remote_src: true
  when:
    - cachyos_repo_check.rc != 0
    - (cachyos_repo_prompt.user_input | default('') | lower) == 'yes'

- name: Update pacman repositories with CachyOS repo script
  become: true
  ansible.builtin.shell: yes | ./cachyos-repo.sh --install
  args:
    chdir: "{{ cachyos_repo_tmp.path }}/cachyos-repo"
    executable: /bin/bash
  when:
    - cachyos_repo_check.rc != 0
    - (cachyos_repo_prompt.user_input | default('') | lower) == 'yes'

- name: Remove CachyOS repo bootstrap directory
  become: true
  ansible.builtin.file:
    path: "{{ cachyos_repo_tmp.path }}"
    state: absent
  when:
    - cachyos_repo_tmp is defined
    - cachyos_repo_tmp.path is defined

- name: Re-check CachyOS repositories are configured
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - ^\[(cachyos|cachyos-v3|cachyos-v4|cachyos-znver4)\]
      - /etc/pacman.conf
  register: cachyos_repo_recheck
  changed_when: false
  failed_when: false
  when: cachyos_repo_check.rc != 0

- name: Require CachyOS repositories on Arch
  ansible.builtin.fail:
    msg: CachyOS repository update did not configure pacman.
  when:
    - cachyos_repo_check.rc != 0
    - cachyos_repo_recheck.rc != 0
