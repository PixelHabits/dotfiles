---
- name: Workstation bootstrap
  hosts: localhost
  connection: local
  become: false

  vars:
    # ── XDG Base Directories ────────────────────────────────
    user_home: "{{ lookup('ansible.builtin.env', 'HOME')}}"
    xdg_config_home: "{{ user_home }}/.config"
    xdg_cache_home: "{{ user_home }}/.cache"
    xdg_data_home: "{{ user_home }}/.local/share"
    xdg_state_home: "{{ user_home }}/.local/state"
    local_bin: "{{ user_home }}/.local/bin"
    user_desktop_dirs:
      - "{{ user_home }}/Documents"
      - "{{ user_home }}/Downloads"
      - "{{ user_home }}/Pictures"

    xdg_dirs:
      - "{{ xdg_config_home }}"
      - "{{ xdg_cache_home }}"
      - "{{ xdg_data_home }}"
      - "{{ xdg_state_home }}"
      - "{{ local_bin }}"
      - "{{ xdg_state_home }}/zsh"
      - "{{ xdg_cache_home }}/zsh"

    # ── XDG environment for subprocesses ────────────────────
    # Keep this limited to redirects Ansible actually needs.
    # The full shell/systemd runtime mirror lives in zshenv.d
    # and environment.d.
    xdg_environment:
      XDG_CONFIG_HOME: "{{ xdg_config_home }}"
      XDG_CACHE_HOME: "{{ xdg_cache_home }}"
      XDG_DATA_HOME: "{{ xdg_data_home }}"
      XDG_STATE_HOME: "{{ xdg_state_home }}"
      CARGO_HOME: "{{ xdg_data_home }}/cargo"
      RUSTUP_HOME: "{{ xdg_data_home }}/rustup"
      GOPATH: "{{ xdg_data_home }}/go"
      GOMODCACHE: "{{ xdg_cache_home }}/go/mod"
      BUN_INSTALL: "{{ xdg_data_home }}/bun"
      DOTNET_CLI_HOME: "{{ xdg_data_home }}/dotnet"
      NPM_CONFIG_CACHE: "{{ xdg_cache_home }}/npm"

    # ── Oh My Zsh ───────────────────────────────────────────
    omz_dir: "{{ xdg_data_home }}/oh-my-zsh"
    p10k_dir: "{{ omz_dir }}/custom/themes/powerlevel10k"

    # ── Packages ────────────────────────────────────────────
    common_packages:
      - zsh
      - btop
      - fzf
      - ripgrep
      - fastfetch
      - eza
      - zoxide
      - tmux
      - unzip
      - bat
      - zip
      - wget

    hardware_packages:
      Linux:
        - dosfstools # /boot EFI (fwupd)
        - exfatprogs # USB Flash Drives
        - fwupd
        - ntfs-3g # Windows External Drives
        - udisks2
        - udisks2-btrfs # BTRFS filesystems

    distro_packages:
      Archlinux:
        - bun
        - fd
        - github-cli
        - man-db
        - ghostty-terminfo
        - ufw
        - uv
      Ubuntu:
        - neovim
        - fd-find
        - gh
        - man-db
        - ufw
      Fedora:
        - neovim
        - fd-find
        - gh
        - man-db
        - ghostty-terminfo
        - ufw
        - uv
      Darwin:
        - neovim
        - fd
        - fnm
        - gh
        - rustup
        - uv

    aur_packages:
      - neovim-git

    macos_casks:
      - 1password
      - 1password-cli
      - docker
      - ghostty
      - font-jetbrains-mono-nerd-font
      - helium-browser

  environment: "{{ xdg_environment }}"

  pre_tasks:
    - name: Fail on unsupported OS
      ansible.builtin.fail:
        msg: >-
          Unsupported: {{ ansible_facts['distribution'] }} ({{
          ansible_facts['os_family'] }}). Supported: Archlinux, Ubuntu, Fedora,
          macOS.
      when: >-
        ansible_facts['distribution'] not in distro_packages and
        ansible_facts['os_family'] != 'Darwin'

    # ── Bare Metal detection ──────────────────────────────
    - name: Detect if running on bare metal (not a VM/WSL)
      ansible.builtin.set_fact:
        is_bare_metal: "{{ ansible_facts['virtualization_role'] != 'guest' }}"

    - name: Append hardware packages to distro_packages (Linux Bare Metal only)
      ansible.builtin.set_fact:
        distro_packages: >-
          {{ distro_packages | combine({
               ansible_facts['distribution']: distro_packages[ansible_facts['distribution']] + hardware_packages['Linux']
             })
          }}
      when: is_bare_metal and ansible_facts['system'] == 'Linux'

    # ── Intel GPU detection ───────────────────────────────
    - name: Detect Intel GPU
      ansible.builtin.shell: |
        lspci | grep -iE 'vga|3d' | grep -i intel
      register: intel_detect
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['system'] == 'Linux'
        - ansible_facts['distribution'] == 'Archlinux'

    - name: Append Intel GPU packages to distro packages
      ansible.builtin.set_fact:
        distro_packages: >-
          {{ distro_packages | combine({
               'Archlinux': distro_packages['Archlinux'] + [
                 'vulkan-intel',
                 'intel-media-driver'
               ]
             })
          }}
      when:
        - ansible_facts['system'] == 'Linux'
        - ansible_facts['distribution'] == 'Archlinux'
        - intel_detect.stdout | default('') | length > 0

    # ── Nvidia GPU detection ──────────────────────────────
    #   Blackwell+ (RTX 50xx)          → nvidia-open
    #   Turing–Ada (RTX 20–40, GTX 16) → nvidia-open
    #   Pascal (GTX 10xx)              → nvidia-580xx-dkms
    - name: Detect Nvidia GPU
      ansible.builtin.shell: |
        lspci | grep -iE 'vga|3d' | grep -i nvidia
      register: nvidia_detect
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['system'] == 'Linux'
        - ansible_facts['distribution'] == 'Archlinux'

    - name: Set Nvidia generation
      ansible.builtin.set_fact:
        nvidia_generation: >-
          {%- set gpu = nvidia_detect.stdout | default('') -%} {%- if gpu is
          search('RTX [5-9]0') -%}blackwell {%- elif gpu is search('RTX
          [2-4]0|GTX 16') -%}turing_ada {%- elif gpu is search('GTX 10')
          -%}pascal {%- else -%}none {%- endif -%}
      when:
        - ansible_facts['system'] == 'Linux'
        - ansible_facts['distribution'] == 'Archlinux'

    - name: Build Nvidia package list and append to AUR packages
      vars:
        nvidia_driver_map:
          blackwell:
            - nvidia-open
            - nvidia-utils
            - nvidia-settings
            - libva-nvidia-driver
          turing_ada:
            - nvidia-open
            - nvidia-utils
            - nvidia-settings
            - libva-nvidia-driver
          pascal:
            - linux-headers
            - nvidia-580xx-dkms
            - nvidia-580xx-utils
          none: []
      ansible.builtin.set_fact:
        has_nvidia: "{{ nvidia_generation != 'none' }}"
        nvidia_packages: "{{ nvidia_driver_map[nvidia_generation] }}"
        aur_packages: "{{ aur_packages + nvidia_driver_map[nvidia_generation] }}"
      when:
        - ansible_facts['system'] == 'Linux'
        - ansible_facts['distribution'] == 'Archlinux'

  roles:
    - { role: base, tags: [base, cli] }
    - { role: zsh, tags: [zsh, cli] }
    - {
        role: laptop,
        tags: [laptop, cli],
        when: "chezmoi_form_factor == 'laptop'",
      }
    - { role: hyprland, tags: [desktop], when: "chezmoi_desktop == 'hyprland'" }
    - { role: dev, tags: [dev] }
